        :root {
            /* ---- Palette: Prime Video — nero blu profondo, azzurro Prime, accenti neutri ---- */
            --bg: #0F171E;
            --bg-raised: #16212B;
            --surface: #1A2733;
            --surface-hover: #223342;
            --surface-elevated: #1D2B38;
            --border: rgba(255,255,255,0.09);
            --border-soft: rgba(255,255,255,0.06);
            --text: #FFFFFF;
            --text-muted: #A9B7C2;
            --text-faint: #6E7C88;

            --prime: #00A8E1;
            --prime-light: #4FC3F0;
            --prime-dark: #007EB0;
            --prime-text: #00131A;

            --success: #3FD787;
            --success-text: #00190D;
            --danger: #FF5B65;

            --radius-lg: 12px;
            --radius-md: 8px;
            --radius-sm: 6px;

            --font-display: 'Manrope', sans-serif;
            --font-body: 'Manrope', sans-serif;

            --shadow-elevated: 0 24px 48px -18px rgba(0,0,0,0.8);
            --shadow-soft: 0 12px 26px -12px rgba(0,0,0,0.65);

            --nav-h: 60px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-body);
            background-color: var(--bg);
            background-image: radial-gradient(ellipse 1000px 520px at 50% 0%, rgba(0,168,225,0.10), transparent 60%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            position: relative;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        button, input { font-family: inherit; }

        button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
            outline: 2px solid var(--prime);
            outline-offset: 2px;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ================= AUTH SCREEN ================= */
        #auth-screen {
            max-width: 400px;
            margin: 0 auto;
            min-height: 100vh;
            display: none;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            padding: 40px 28px;
            position: relative;
            z-index: 1;
            animation: fadeUp 0.4s ease both;
        }

        .auth-mark {
            width: 56px;
            height: 56px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--prime);
            box-shadow: 0 0 0 6px rgba(0,168,225,0.14);
        }
        .auth-mark svg { width: 22px; height: 22px; fill: #fff; }

        .auth-brand {
            text-align: center;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            margin-bottom: 28px;
            color: var(--text);
            text-transform: lowercase;
        }
        .auth-brand span { color: var(--prime); }

        #auth-screen h2 {
            font-weight: 800;
            letter-spacing: -0.01em;
            margin-bottom: 22px;
            font-size: 1.3rem;
            text-align: left;
            color: #fff;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .field-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-raised);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .field-wrap:focus-within {
            border-color: var(--prime);
            box-shadow: 0 0 0 3px rgba(0,168,225,0.16);
        }

        .field-wrap svg {
            width: 17px;
            height: 17px;
            flex-shrink: 0;
            color: var(--text-faint);
        }

        .auth-input {
            background: transparent;
            border: none;
            color: var(--text);
            padding: 14px 0;
            font-size: 16px;
            outline: none;
            width: 100%;
            font-family: inherit;
        }

        .auth-input::placeholder { color: var(--text-faint); }

        .btn-auth {
            background: var(--prime);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.2px;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            margin-top: 6px;
        }

        .btn-auth:hover { background: var(--prime-light); }
        .btn-auth:active { transform: translateY(1px); }

        .auth-switch {
            margin-top: 20px;
            text-align: center;
            font-size: 0.87rem;
            color: var(--text-muted);
        }

        .auth-switch span {
            color: var(--prime-light);
            cursor: pointer;
            font-weight: 700;
        }
        .auth-switch span:hover { text-decoration: underline; }

        .auth-error {
            color: var(--danger);
            font-size: 0.82rem;
            text-align: center;
            margin-top: 12px;
            min-height: 1em;
        }

        /* ================= TOPNAV (stile Prime Video) ================= */
        .topnav {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 200;
            background: rgba(13,19,25,0.98);
            border-bottom: 1px solid var(--border-soft);
            backdrop-filter: blur(10px);
        }

        .topnav-inner {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 28px;
            padding: 0 20px;
            height: var(--nav-h);
        }

        .brand {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: -0.02em;
            color: #fff;
            text-transform: lowercase;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .brand .brand-mark {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--prime);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .brand .brand-mark svg { width: 11px; height: 11px; fill: #fff; }
        .brand span { color: var(--prime); }

        .tabs {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            flex: 1;
            height: 100%;
        }
        .tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            flex: 0 0 auto;
            background: transparent;
            color: var(--text-muted);
            border: none;
            border-bottom: 2px solid transparent;
            padding: 0 4px;
            height: 100%;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.87rem;
            white-space: nowrap;
            transition: color 0.2s, border-color 0.2s;
        }
        .tab-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

        .tab-btn:hover { color: var(--text); }

        .tab-btn.active {
            color: #fff;
            border-bottom-color: var(--prime);
        }

        .user-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .user-bar-id {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--prime), var(--prime-dark));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .user-bar-id .user-email-text {
            display: block;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 26vw;
        }

        .btn-logout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .btn-logout svg { width: 15px; height: 15px; }
        .btn-logout .logout-label { display: none; }

        .btn-logout:hover {
            background: rgba(255,91,101,0.12);
            color: var(--danger);
            border-color: var(--danger);
        }

        @media (min-width: 860px) {
            .btn-logout { width: auto; padding: 0 14px; gap: 7px; }
            .btn-logout .logout-label { display: inline; font-size: 0.82rem; font-weight: 700; }
        }

        /* ================= CONTENUTO ================= */
        .content {
            max-width: 1240px;
            margin: 0 auto;
            padding: 28px 20px 60px;
        }

        .tab-content { display: none; }

        .tab-content.active {
            display: block;
            animation: fadeUp 0.35s ease;
        }

        .section-heading {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.3rem;
            letter-spacing: -0.01em;
            color: #fff;
            margin-bottom: 18px;
        }

        /* ================= CARTELLE (solo "Da vedere") ================= */
        .folder-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .folder-chip {
            display: flex;
            align-items: center;
            gap: 7px;
            background: var(--bg-raised);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 8px 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.18s;
        }

        .folder-chip:hover { color: var(--text); border-color: var(--text-muted); }

        .folder-chip.active {
            background: var(--prime);
            color: #fff;
            border-color: var(--prime);
        }

        .folder-chip .folder-count {
            opacity: 0.75;
            font-weight: 600;
        }

        .folder-chip-remove {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            color: inherit;
            flex-shrink: 0;
            font-size: 0.7rem;
            line-height: 1;
        }
        .folder-chip.active .folder-chip-remove { background: rgba(0,0,0,0.2); }
        .folder-chip-remove:hover { background: var(--danger) !important; color: #fff; }

        .folder-chip-add {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: 1px dashed var(--border);
            color: var(--text-faint);
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.18s;
        }
        .folder-chip-add:hover { color: var(--prime-light); border-color: var(--prime); }
        .folder-chip-add svg { width: 14px; height: 14px; }

        .folder-add-form {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-raised);
            border: 1px solid var(--prime);
            border-radius: 999px;
            padding: 4px 4px 4px 14px;
        }

        .folder-add-form input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 16px;
            font-weight: 600;
            width: 140px;
            font-family: inherit;
        }
        .folder-add-form input::placeholder { color: var(--text-faint); }

        .folder-add-form button {
            border: none;
            border-radius: 999px;
            width: 26px;
            height: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            flex-shrink: 0;
        }
        .folder-add-confirm { background: var(--prime); color: #fff; }
        .folder-add-confirm:hover { background: var(--prime-light); }
        .folder-add-cancel { background: transparent; color: var(--text-faint); }
        .folder-add-cancel:hover { color: var(--danger); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ================= RICERCA ================= */
        .search-wrapper {
            position: relative;
            margin-bottom: 26px;
            max-width: 460px;
        }

        .search-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-raised);
            border: 1px solid var(--border);
            padding: 4px 16px;
            border-radius: var(--radius-sm);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input-group:focus-within {
            border-color: var(--prime);
            box-shadow: 0 0 0 3px rgba(0,168,225,0.14);
        }

        .search-input-group svg {
            width: 18px;
            height: 18px;
            color: var(--text-faint);
            flex-shrink: 0;
        }

        .search-input-group input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            padding: 12px 2px;
            font-size: 16px;
            outline: none;
            min-width: 0;
        }
        .search-input-group input::placeholder { color: var(--text-faint); }

        .suggestions-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            margin-top: 8px;
            max-height: 380px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: var(--shadow-elevated);
            display: none;
        }

        .suggestion-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-soft);
            border-left: 2px solid transparent;
            transition: background 0.15s, border-color 0.15s;
        }

        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover {
            background: var(--surface-hover);
            border-left-color: var(--prime);
        }

        .suggestion-poster {
            width: 42px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            background: var(--border);
            flex-shrink: 0;
        }

        .suggestion-info { min-width: 0; }
        .suggestion-info h4 {
            font-size: 0.92rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .suggestion-info p {
            font-size: 0.76rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-weight: 600;
        }

        /* ================= GRIGLIA & CARD (stile poster Prime Video) ================= */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 18px 14px;
        }

        .media-card {
            background-color: transparent;
            border: none;
            border-radius: var(--radius-md);
            overflow: visible;
            display: flex;
            flex-direction: column;
            animation: fadeUp 0.4s ease both;
        }

        .media-poster-container {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            background: var(--surface);
            overflow: hidden;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-soft);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .media-card:hover .media-poster-container,
        .media-poster-container:focus-visible {
            transform: translateY(-4px) scale(1.035);
            box-shadow: var(--shadow-elevated);
            border-color: rgba(0,168,225,0.4);
            z-index: 2;
        }
        .media-poster-container:focus-visible { outline: 2px solid var(--prime); outline-offset: 2px; }

        .media-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: filter 0.25s ease;
        }
        .media-card:hover .media-poster { filter: brightness(1.05); }

        .media-poster-container::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 62%, rgba(6,10,14,0.88) 100%);
            pointer-events: none;
        }

        .poster-info-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            background: rgba(6,10,14,0.32);
            transition: opacity 0.2s ease;
            pointer-events: none;
        }
        .media-card:hover .poster-info-hint,
        .media-poster-container:focus-visible .poster-info-hint {
            opacity: 1;
        }
        .poster-info-hint span {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(8,13,17,0.75);
            border: 1px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(3px);
        }
        .poster-info-hint svg { width: 20px; height: 20px; color: #fff; }

        .media-type-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(8, 13, 17, 0.72);
            backdrop-filter: blur(6px);
            padding: 4px 8px 4px 6px;
            border-radius: 4px;
            font-size: 0.63rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border: 1px solid rgba(255,255,255,0.14);
            z-index: 1;
        }
        .media-type-badge svg { width: 10px; height: 10px; }
        .media-type-badge.gold { color: var(--prime-light); border-color: rgba(0,168,225,0.4); }
        .media-type-badge.success { color: var(--success); border-color: rgba(63,215,135,0.4); }
        .media-type-badge.crimson { color: #FFB4B9; border-color: rgba(255,91,101,0.4); }

        .media-body {
            padding: 10px 2px 0;
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 10px;
        }

        .media-title {
            font-size: 0.86rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .tracker-controls {
            background: var(--bg-raised);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 9px 10px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .tracker-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.76rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .tracker-row span b { color: var(--text); font-weight: 800; }

        .counter-btns { display: flex; gap: 5px; }

        .btn-count {
            width: 26px;
            height: 26px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .btn-count:hover {
            border-color: var(--prime);
            background: var(--prime);
            color: #fff;
        }

        .card-actions { display: flex; flex-wrap: wrap; gap: 6px; }
        .card-actions .btn-action { flex: 1 1 calc(50% - 3px); }

        .btn-action {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            background: var(--bg-raised);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.76rem;
            font-weight: 700;
            transition: all 0.2s;
            min-height: 36px;
        }
        .btn-action svg { width: 13px; height: 13px; }

        .btn-action:hover { color: var(--text); border-color: var(--text-muted); }
        .btn-action.success:hover { background: rgba(63,215,135,0.12); border-color: var(--success); color: var(--success); }
        .btn-action.danger:hover { background: rgba(255,91,101,0.12); border-color: var(--danger); color: var(--danger); }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 24px;
            color: var(--text-muted);
            font-size: 0.92rem;
            background: var(--bg-raised);
            border: 1px dashed var(--border);
            border-radius: var(--radius-lg);
        }
        .empty-state svg {
            width: 40px;
            height: 40px;
            color: var(--text-faint);
            margin-bottom: 14px;
        }
        .empty-state p:first-of-type { color: var(--text); font-weight: 700; margin-bottom: 4px; }

        /* ================= RESPONSIVE ================= */
        @media (max-width: 640px) {
            .topnav-inner { gap: 16px; padding: 0 14px; }
            .brand span.brand-full { display: none; }
            .content { padding: 20px 14px 50px; }
            #auth-screen { padding: 32px 20px; }
            .items-grid { grid-template-columns: repeat(3, 1fr); gap: 10px 8px; }
            .user-bar-id .user-email-text { display: none; }
            .media-title { font-size: 0.74rem; }
            .media-body { padding: 8px 1px 0; gap: 7px; }
            .card-actions { gap: 5px; }
            .card-actions .btn-action { flex: 1 1 100%; }
            .btn-action { font-size: 0.68rem; padding: 7px 4px; min-height: 32px; gap: 3px; }
            .btn-action svg { width: 11px; height: 11px; }
            .tracker-controls { padding: 7px 8px; gap: 5px; }
            .tracker-row { font-size: 0.68rem; }
            .btn-count { width: 22px; height: 22px; }
        }

        @media (max-width: 420px) {
            .brand { font-size: 0; gap: 0; }
            .brand .brand-mark { width: 28px; height: 28px; }
            .items-grid { gap: 8px 6px; }
        }

        /* ================= MODALE DETTAGLI ================= */

        window.handleSearch = function(section, query) {

            if (!query || query.trim().length < 2) {
                dropdown.style.display = 'none';

            searchTimeouts[section] = setTimeout(async () => {
                try {

        // Estrae un anno (es. "1994") dalla query, restituendo anche il testo rimanente
        function extractYear(query) {
            const match = query.match(/\b(19\d{2}|20\d{2})\b/);
            if (!match) return { year: null, textQuery: query.trim() };
            const year = match[0];
            const textQuery = (query.slice(0, match.index) + query.slice(match.index + year.length))
                .replace(/\s+/g, ' ').trim();
            return { year, textQuery };

            // 1. Ricerca per titolo (senza l'eventuale anno, per non "sporcare" la query)

                        .then(r => r.json())
                        .then(d => (d.results || [])
                            .filter(it => it.media_type === 'movie' || it.media_type === 'tv')
                            .map(it => ({ ...it, _match: 'title' })))
                        .catch(() => [])
                );
            }

            // 1b. Se c'è un anno insieme al testo (o la query è tutta numerica), prova anche la query originale

            if (year) {
                tasks.push(
                    fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&language=it-IT&query=${encodeURIComponent(rawQuery.trim())}`)
                        .then(r => r.json())
                        .then(d => (d.results || [])
                            .filter(it => it.media_type === 'movie' || it.media_type === 'tv')
                            .map(it => ({ ...it, _match: 'title' })))
                        .catch(() => [])
                );
            }

            // 2. Ricerca per persona: attore o regista
            if (textQuery.length >= 2) {
                tasks.push(
                    fetch(`https://api.themoviedb.org/3/search/person?api_key=${TMDB_API_KEY}&language=it-IT&query=${encodeURIComponent(textQuery)}`)
                        .then(r => r.json())
                        .then(async d => {
                            const person = (d.results || [])[0];
                            if (!person) return [];
                            const creditsRes = await fetch(`https://api.themoviedb.org/3/person/${person.id}/combined_credits?api_key=${TMDB_API_KEY}&language=it-IT`);
                            const credits = await creditsRes.json();

                            const cast = (credits.cast || [])
                                .filter(c => c.media_type === 'movie' || c.media_type === 'tv')
                                .map(c => ({ ...c, _match: 'cast', _person: person.name }));

                            const directing = (credits.crew || [])
                                .filter(c => (c.media_type === 'movie' || c.media_type === 'tv') && c.job === 'Director')
                                .map(c => ({ ...c, _match: 'crew', _person: person.name }));

                            return [...cast, ...directing]

            if (year && textQuery.length < 2) {
                tasks.push(
                    fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_API_KEY}&language=it-IT&primary_release_year=${year}&sort_by=popularity.desc`)
                        .then(r => r.json())
                        .then(d => (d.results || []).map(it => ({ ...it, media_type: 'movie', _match: 'year' })))
                        .catch(() => [])
                );
                tasks.push(
                    fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_API_KEY}&language=it-IT&first_air_date_year=${year}&sort_by=popularity.desc`)
                        .then(r => r.json())
                        .then(d => (d.results || []).map(it => ({ ...it, media_type: 'tv', _match: 'year' })))
                        .catch(() => [])
                );
            }

            const groups = await Promise.all(tasks);
            let merged = groups.flat();

            // Deduplica per id+tipo, mantenendo la prima occorrenza (priorità: titolo > persona > anno)
            const seen = new Set();
            merged = merged.filter(it => {
                const key = `${it.media_type}_${it.id}`;
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });

            // Se testo e anno sono presenti insieme, dai priorità ai risultati che corrispondono all'anno
            if (year && textQuery.length >= 2) {
                merged.sort((a, b) => {
                    const aMatch = (a.release_date || a.first_air_date || '').startsWith(year) ? 0 : 1;
                    const bMatch = (b.release_date || b.first_air_date || '').startsWith(year) ? 0 : 1;
                    return aMatch - bMatch;
                });
            }

            // Raggruppa per tipo pertinente alla sezione (film in evidenza per "toWatch"/"watched", serie per "series")
            if (section === 'series') {
                merged.sort((a, b) => (b.media_type === 'tv') - (a.media_type === 'tv'));
            } else {
                merged.sort((a, b) => (b.media_type === 'movie') - (a.media_type === 'movie'));
            }

            return merged.slice(0, 8);
        }

        function showDropdown(section, items) {
            const dropdown = document.getElementById(`dropdown${capitalize(section)}`);
            if (items.length === 0) {
                dropdown.style.display = 'none';
                return;
            }

            dropdown.innerHTML = '';
            items.forEach(item => {
                const title = item.title || item.name;
                const date = item.release_date || item.first_air_date || '';
                const yearLabel = date ? date.split('-')[0] : '';
                const poster = item.poster_path ? `${IMAGE_BASE_URL}${item.poster_path}` : 'https://via.placeholder.com/45x65?text=No+Img';
                const typeLabel = item.media_type === 'tv' ? 'Serie TV' : 'Film';

                let subtitle = typeLabel;
                if (yearLabel) subtitle += ` · ${yearLabel}`;
                if (item._match === 'cast') subtitle += ` · con ${item._person}`;
                else if (item._match === 'crew') subtitle += ` · regia di ${item._person}`;

                const el = document.createElement('div');
                el.className = 'suggestion-item';
                el.innerHTML = `
                    <img src="${poster}" class="suggestion-poster" alt="${escapeHtml(title)}">
                    <div class="suggestion-info">
                        <h4>${escapeHtml(title)}</h4>
                        <p>${escapeHtml(subtitle)}</p>
                    </div>
                `;
                el.addEventListener('click', () => {
                    addItem(section, {
                        id: item.id,
                        title: title,
                        poster: item.poster_path,
                        type: item.media_type
                    });
                });
                dropdown.appendChild(el);
            });

            dropdown.style.display = 'block';
        }

        function generateUniqueId() {
            return (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(36).slice(2)));
        }

        window.addItem = function(section, itemData) {
            document.getElementById(`input${capitalize(section)}`).value = '';
            document.getElementById(`dropdown${capitalize(section)}`).style.display = 'none';

            if (!data.series) data.series = [];
            if (!data.toWatch) data.toWatch = [];
            if (!data.watched) data.watched = [];

            if (section === 'series') {
                data.series.push({
                    id: generateUniqueId(),
                    tmdbId: itemData.id,
                    title: itemData.title,
                    poster: itemData.poster,
                    type: 'tv',
                    season: 1,
                    episode: 1
                });
            } else if (section === 'toWatch') {
                data.toWatch.push({
                    id: generateUniqueId(),
                    tmdbId: itemData.id,
                    title: itemData.title,
                    poster: itemData.poster,
                    type: itemData.type || 'movie',
                    folder: activeFolder
                });
            } else if (section === 'watched') {
                data.watched.push({
                    id: generateUniqueId(),
                    tmdbId: itemData.id,
                    title: itemData.title,
                    poster: itemData.poster,
                    type: itemData.type || 'movie'
                });
            }

            saveDataToFirebase();
        }

        window.moveToWatched = function(id) {
            const index = data.toWatch.findIndex(m => m.id === id);
            if (index !== -1) {
                const movie = data.toWatch.splice(index, 1)[0];
                data.watched.push(movie);
                saveDataToFirebase();
            }
        }

        window.deleteItem = function(section, id) {
            data[section] = data[section].filter(item => item.id !== id);
            saveDataToFirebase();
        }

        // ============ CARTELLE (solo tab "Da vedere") ============
        function getToWatchFolders() {
            // Elenco cartelle: 'Generale' sempre presente + tutte quelle usate dai film
            const set = new Set([DEFAULT_FOLDER]);
            (data.toWatch || []).forEach(m => set.add(m.folder || DEFAULT_FOLDER));
            (data.toWatchFolders || []).forEach(f => set.add(f));
            return Array.from(set);
        }

        window.selectFolder = function(name) {
            activeFolder = name;
            addingFolder = false;
            renderAll();
        }

        window.showAddFolderForm = function() {
            addingFolder = true;
            renderAll();
            const input = document.getElementById('newFolderInput');
            if (input) input.focus();
        }

        window.cancelAddFolderForm = function() {
            addingFolder = false;
            renderAll();
        }

        window.confirmAddFolder = function() {
            const input = document.getElementById('newFolderInput');
            if (!input) return;
            const name = input.value.trim();
            if (!name) { addingFolder = false; renderAll(); return; }

            if (!data.toWatchFolders) data.toWatchFolders = [];
            if (!data.toWatchFolders.includes(name) && name !== DEFAULT_FOLDER) {
                data.toWatchFolders.push(name);
            }
            activeFolder = name;
            addingFolder = false;
            saveDataToFirebase();
            renderAll();
        }

        window.deleteFolder = function(name, evt) {
            if (evt) evt.stopPropagation();
            if (name === DEFAULT_FOLDER) return;
            if (!confirm(`Eliminare la cartella "${name}"? I film verranno spostati in "${DEFAULT_FOLDER}".`)) return;

            (data.toWatch || []).forEach(m => {
                if ((m.folder || DEFAULT_FOLDER) === name) m.folder = DEFAULT_FOLDER;
            });
            data.toWatchFolders = (data.toWatchFolders || []).filter(f => f !== name);
            if (activeFolder === name) activeFolder = DEFAULT_FOLDER;
            saveDataToFirebase();
            renderAll();
        }

        function renderFolderBar() {
            const bar = document.getElementById('folderBar');
            if (!bar) return;
            const folders = getToWatchFolders();

            let html = folders.map(name => {
                const count = (data.toWatch || []).filter(m => (m.folder || DEFAULT_FOLDER) === name).length;
                const isActive = name === activeFolder;
                const removeBtn = name === DEFAULT_FOLDER ? '' :
                    `<span class="folder-chip-remove" onclick="deleteFolder('${escapeHtml(name).replace(/'/g, "\\'")}', event)">✕</span>`;
                return `
                    <div class="folder-chip ${isActive ? 'active' : ''}" onclick="selectFolder('${escapeHtml(name).replace(/'/g, "\\'")}')">
                        <span>${escapeHtml(name)}</span>
                        <span class="folder-count">${count}</span>
                        ${removeBtn}
                    </div>
                `;
            }).join('');

            if (addingFolder) {
                html += `
                    <div class="folder-add-form">
                        <input type="text" id="newFolderInput" placeholder="Nome cartella..." maxlength="30"
                            onkeydown="if(event.key==='Enter') confirmAddFolder(); if(event.key==='Escape') cancelAddFolderForm();">
                        <button class="folder-add-confirm" onclick="confirmAddFolder()">✓</button>
                        <button class="folder-add-cancel" onclick="cancelAddFolderForm()">✕</button>
                    </div>
                `;
            } else {
                html += `
                    <button class="folder-chip-add" onclick="showAddFolderForm()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Nuova cartella
                    </button>
                `;
            }

            bar.innerHTML = html;
        }

        // ============ MODALE DETTAGLI (TMDB) ============
        window.showDetails = async function(tmdbId, type) {
            const modal = document.getElementById('details-modal');
            const body = document.getElementById('details-body');
            const mediaType = type === 'tv' ? 'tv' : 'movie';

            body.innerHTML = `
                <div class="modal-loading">
                    <div class="spinner"></div>
                    <p>Caricamento dettagli...</p>
                </div>
            `;
            modal.classList.add('open');
            document.body.style.overflow = 'hidden';

            try {
                const url = `https://api.themoviedb.org/3/${mediaType}/${tmdbId}?api_key=${TMDB_API_KEY}&language=it-IT&append_to_response=credits`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Richiesta non riuscita');
                const details = await response.json();
                renderDetails(details, mediaType);
            } catch (error) {
                console.error('Errore dettagli TMDB:', error);
                body.innerHTML = `
                    <div class="modal-error">
                        <p>Non è stato possibile caricare i dettagli. Riprova più tardi.</p>
                    </div>
                `;
            }
        }

        window.closeDetails = function() {
            document.getElementById('details-modal').classList.remove('open');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeDetails();
        });

        function renderDetails(d, mediaType) {
            const body = document.getElementById('details-body');
            const title = d.title || d.name || '';
            const poster = d.poster_path ? IMAGE_BASE_URL + d.poster_path : 'https://via.placeholder.com/300x450?text=No+Image';
            const year = (d.release_date || d.first_air_date || '').split('-')[0] || '—';
            const genres = (d.genres || []).map(g => g.name);
            const rating = d.vote_average ? d.vote_average.toFixed(1) : null;

            let runtimeLabel = '';
            if (mediaType === 'movie') {
                const mins = d.runtime;
                runtimeLabel = mins ? `${Math.floor(mins / 60)}h ${mins % 60}min` : null;
            } else {
                const ep = d.episode_run_time && d.episode_run_time.length ? d.episode_run_time[0] : null;
                runtimeLabel = ep ? `~${ep} min/episodio` : null;
            }

            const crew = (d.credits && d.credits.crew) || [];
            const cast = (d.credits && d.credits.cast) || [];

            let crewItems = '';
            if (mediaType === 'movie') {
                const directors = crew.filter(c => c.job === 'Director').map(c => c.name);
                if (directors.length) {
                    crewItems += `<div class="details-crew-item"><span class="label">Regia</span><span class="value">${escapeHtml(directors.join(', '))}</span></div>`;
                }
            } else {
                const creators = (d.created_by || []).map(c => c.name);
                if (creators.length) {
                    crewItems += `<div class="details-crew-item"><span class="label">Creato da</span><span class="value">${escapeHtml(creators.join(', '))}</span></div>`;
                }
                crewItems += `<div class="details-crew-item"><span class="label">Stagioni</span><span class="value">${d.number_of_seasons ?? '—'}</span></div>`;
                crewItems += `<div class="details-crew-item"><span class="label">Episodi</span><span class="value">${d.number_of_episodes ?? '—'}</span></div>`;
                if (d.status) {
                    crewItems += `<div class="details-crew-item"><span class="label">Stato</span><span class="value">${escapeHtml(d.status)}</span></div>`;
                }
            }

            const metaItems = [];
            metaItems.push(`<div class="details-meta-item">${ICONS.reel}<span>${year}</span></div>`);
            if (runtimeLabel) {
                metaItems.push(`<div class="details-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg><span>${runtimeLabel}</span></div>`);
            }

            const castHtml = cast.slice(0, 8).map(actor => {
                const img = actor.profile_path ? IMAGE_BASE_URL + actor.profile_path : 'https://via.placeholder.com/84x84?text=%20';
                return `
                    <div class="cast-card">
                        <img src="${img}" alt="${escapeHtml(actor.name)}" loading="lazy">
                        <div class="cast-name">${escapeHtml(actor.name)}</div>
                        <div class="cast-role">${escapeHtml(actor.character || '')}</div>
                    </div>
                `;
            }).join('');

            body.innerHTML = `
                <div class="details-hero">
                    <div class="details-poster">
                        <img src="${poster}" alt="${escapeHtml(title)}">
                    </div>
                    <div class="details-main">
                        <div class="details-title">${escapeHtml(title)}</div>
                        ${d.tagline ? `<div class="details-tagline">${escapeHtml(d.tagline)}</div>` : ''}
                        <div class="details-meta">
                            ${metaItems.join('')}
                            ${rating ? `<span class="details-rating">★ ${rating}</span>` : ''}
                        </div>
                        ${genres.length ? `<div class="details-genres">${genres.map(g => `<span class="details-genre-tag">${escapeHtml(g)}</span>`).join('')}</div>` : ''}
                    </div>
                </div>

                ${d.overview ? `
                <div class="details-section">
                    <h4>Trama</h4>
                    <p class="details-overview">${escapeHtml(d.overview)}</p>
                </div>` : ''}

                ${crewItems ? `
                <div class="details-section">
                    <h4>Info</h4>
                    <div class="details-crew-row">${crewItems}</div>
                </div>` : ''}

                ${castHtml ? `
                <div class="details-section">
                    <h4>Cast</h4>
                    <div class="details-cast">${castHtml}</div>
                </div>` : ''}
            `;
        }

        window.updateProgress = function(id, seasonChange, episodeChange) {
            const serie = data.series.find(s => s.id === id);
            if (serie) {
                serie.episode += episodeChange;
                if (serie.episode < 1) {
                    if (serie.season > 1) {
                        serie.season -= 1;
                        serie.episode = 1;
                    } else {
                        serie.episode = 1;
                    }
                }
                saveDataToFirebase();
            }
        }

        window.updateSeasonManual = function(id, change) {
            const serie = data.series.find(s => s.id === id);
            if (serie) {
                serie.season += change;
                if (serie.season < 1) serie.season = 1;
                saveDataToFirebase();
            }
        }

        function renderAll() {
            // Assicuriamoci che gli array esistano
            if(!data.toWatch) data.toWatch = [];
            if(!data.watched) data.watched = [];
            if(!data.series) data.series = [];

            // 1. To Watch (filtrato per cartella attiva)
            renderFolderBar();
            const toWatchFiltered = data.toWatch.filter(m => (m.folder || DEFAULT_FOLDER) === activeFolder);
            const gridToWatch = document.getElementById('gridToWatch');
            gridToWatch.innerHTML = toWatchFiltered.length === 0 ? `
                <div class="empty-state">
                    ${ICONS.reel}
                    <p>Nessun film in questa cartella</p>
                    <p>Cerca un titolo qui sopra per aggiungerlo a "${escapeHtml(activeFolder)}".</p>
                </div>` :
                toWatchFiltered.map(m => `
                    <div class="media-card">
                        <div class="media-poster-container" onclick="showDetails(${m.tmdbId}, '${m.type || 'movie'}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showDetails(${m.tmdbId}, '${m.type || 'movie'}');}" role="button" tabindex="0" aria-label="Dettagli di ${escapeHtml(m.title)}">
                            <img src="${m.poster ? IMAGE_BASE_URL + m.poster : 'https://via.placeholder.com/300x180?text=No+Image'}" class="media-poster" alt="${m.title}">
                            <span class="media-type-badge gold">${ICONS.film} Film</span>
                            <span class="poster-info-hint"><span>${ICONS.info}</span></span>
                        </div>
                        <div class="media-body">
                            <div class="media-title">${escapeHtml(m.title)}</div>
                            <div class="card-actions">
                                <button class="btn-action success" onclick="moveToWatched(${m.id})">${ICONS.check} Visto</button>
                                <button class="btn-action danger" onclick="deleteItem('toWatch', ${m.id})">${ICONS.trash} Elimina</button>
                            </div>
                        </div>
                    </div>
                `).join('');

            // 2. Watched
            const gridWatched = document.getElementById('gridWatched');
            gridWatched.innerHTML = data.watched.length === 0 ? `
                <div class="empty-state">
                    ${ICONS.reel}
                    <p>Nessun film visto registrato</p>
                    <p>I titoli segnati come "Visto" compariranno qui.</p>
                </div>` :
                data.watched.map(m => `
                    <div class="media-card">
                        <div class="media-poster-container" onclick="showDetails(${m.tmdbId}, '${m.type || 'movie'}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showDetails(${m.tmdbId}, '${m.type || 'movie'}');}" role="button" tabindex="0" aria-label="Dettagli di ${escapeHtml(m.title)}">
                            <img src="${m.poster ? IMAGE_BASE_URL + m.poster : 'https://via.placeholder.com/300x180?text=No+Image'}" class="media-poster" alt="${m.title}">
                            <span class="media-type-badge success">${ICONS.check} Visto</span>
                            <span class="poster-info-hint"><span>${ICONS.info}</span></span>
                        </div>
                        <div class="media-body">
                            <div class="media-title">${escapeHtml(m.title)}</div>
                            <div class="card-actions">
                                <button class="btn-action danger" onclick="deleteItem('watched', ${m.id})">${ICONS.trash} Elimina</button>
                            </div>
                        </div>
                    </div>
                `).join('');

            // 3. Series
            const gridSeries = document.getElementById('gridSeries');
            gridSeries.innerHTML = data.series.length === 0 ? `
                <div class="empty-state">
                    ${ICONS.reel}
                    <p>Nessuna serie TV in corso</p>
                    <p>Aggiungi una serie per iniziare a tracciare stagione ed episodio.</p>
                </div>` :
                data.series.map(s => `
                    <div class="media-card">
                        <div class="media-poster-container" onclick="showDetails(${s.tmdbId}, 'tv')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showDetails(${s.tmdbId}, 'tv');}" role="button" tabindex="0" aria-label="Dettagli di ${escapeHtml(s.title)}">
                            <img src="${s.poster ? IMAGE_BASE_URL + s.poster : 'https://via.placeholder.com/300x180?text=No+Image'}" class="media-poster" alt="${s.title}">
                            <span class="media-type-badge crimson">${ICONS.tv} Serie TV</span>
                            <span class="poster-info-hint"><span>${ICONS.info}</span></span>
                        </div>
                        <div class="media-body">
                            <div class="media-title">${escapeHtml(s.title)}</div>
                            <div class="tracker-controls">
                                <div class="tracker-row">
                                    <span>Stagione: <b>${s.season}</b></span>
                                    <div class="counter-btns">
                                        <button class="btn-count" onclick="updateSeasonManual(${s.id}, -1)">−</button>
                                        <button class="btn-count" onclick="updateSeasonManual(${s.id}, 1)">+</button>
                                    </div>
                                </div>
                                <div class="tracker-row">
                                    <span>Episodio: <b>${s.episode}</b></span>
                                    <div class="counter-btns">
                                        <button class="btn-count" onclick="updateProgress(${s.id}, 0, -1)">−</button>
                                        <button class="btn-count" onclick="updateProgress(${s.id}, 0, 1)">+</button>
                                    </div>
                                </div>
                            </div>
                            <div class="card-actions">
                                <button class="btn-action danger" onclick="deleteItem('series', ${s.id})">${ICONS.trash} Elimina</button>
                            </div>
                        </div>
                    </div>
                `).join('');
        }

        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        window.addEventListener('click', function(e) {
            if (!e.target.closest('.search-wrapper')) {
                document.querySelectorAll('.suggestions-dropdown').forEach(d => d.style.display = 'none');
            }
        });
    </script>
</body>
