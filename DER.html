<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePulse - Firebase Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --card-hover: #1a2540;
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --border: #1e293b;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 30px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: #fff;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        header h1 span {
            color: var(--accent);
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Schermata Login/Auth */
        #auth-screen {
            max-width: 400px;
            margin: 80px auto;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 35px;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
        }

        #auth-screen h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .auth-input {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        .auth-input:focus {
            border-color: var(--accent);
        }

        .btn-auth {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-auth:hover {
            background: var(--accent-hover);
        }

        .auth-switch {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-switch span {
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
        }

        .auth-error {
            color: var(--danger);
            font-size: 0.85rem;
            text-align: center;
            margin-top: 10px;
        }

        /* Top Bar App Loggata */
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: var(--radius);
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background: var(--danger);
            color: #fff;
        }

        /* Tabs e Contenuti App */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.25s ease;
        }

        .tab-btn:hover {
            color: var(--text-color);
            border-color: var(--accent);
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 30px;
        }

        .search-input-group {
            display: flex;
            gap: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: var(--radius);
            transition: border-color 0.2s;
        }

        .search-input-group:focus-within {
            border-color: var(--accent);
        }

        .search-input-group input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 10px 15px;
            font-size: 1rem;
            outline: none;
        }

        .suggestions-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-top: 8px;
            max-height: 380px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
        }

        .suggestion-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }

        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: var(--card-hover); }

        .suggestion-poster {
            width: 45px;
            height: 65px;
            object-fit: cover;
            border-radius: 6px;
            background: var(--border);
        }

        .suggestion-info h4 { font-size: 0.95rem; margin-bottom: 4px; color: var(--text-color); }
        .suggestion-info p { font-size: 0.8rem; color: var(--text-muted); }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .media-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .media-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .media-poster-container {
            position: relative;
            width: 100%;
            height: 180px;
            background: var(--border);
            overflow: hidden;
        }

        .media-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.9);
        }

        .media-type-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .media-body {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .media-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #fff;
            line-height: 1.3;
        }

        .tracker-controls {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tracker-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .tracker-row span b { color: var(--text-color); }

        .counter-btns {
            display: flex;
            gap: 5px;
        }

        .btn-count {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.15s;
        }

        .btn-count:hover {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-action:hover { color: #fff; border-color: var(--text-muted); }
        .btn-action.success:hover { background: rgba(16, 185, 129, 0.15); border-color: var(--success); color: var(--success); }
        .btn-action.danger:hover { background: rgba(239, 68, 68, 0.15); border-color: var(--danger); color: var(--danger); }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 0.95rem;
            background: var(--card-bg);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
        }
    </style>
</head>
<body>

    <!-- SCHERMATA LOGIN / REGISTRAZIONE -->
    <div id="auth-screen">
        <h2 id="auth-title">Accedi a CinePulse</h2>
        <div class="auth-form">
            <input type="email" id="auth-email" class="auth-input" placeholder="Indirizzo Email">
            <input type="password" id="auth-password" class="auth-input" placeholder="Password">
            <button class="btn-auth" id="auth-submit-btn" onclick="handleAuthSubmit()">Accedi</button>
            <div id="auth-error" class="auth-error"></div>
        </div>
        <div class="auth-switch">
            <span id="auth-switch-text" onclick="toggleAuthMode()">Non hai un account? Registrati</span>
        </div>
    </div>

    <!-- SCHERMATA PRINCIPALE DELL'APP -->
    <div id="app-screen" class="container" style="display: none;">
        <header>
            <h1>Cine<span>Pulse</span></h1>
            <p>Tracker Cloud multi-utente con sincronizzazione Firebase</p>
        </header>

        <div class="user-bar">
            <span>Connesso come: <b id="user-email-display"></b></span>
            <button class="btn-logout" onclick="logoutUser()">Esci</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('toWatch')">Film da Vedere</button>
            <button class="tab-btn" onclick="switchTab('watched')">Film Visti</button>
            <button class="tab-btn" onclick="switchTab('series')">Serie TV</button>
        </div>

        <!-- TAB: FILM DA VEDERE -->
        <div id="toWatch" class="tab-content active">
            <div class="search-wrapper">
                <div class="search-input-group">
                    <input type="text" id="inputToWatch" placeholder="Cerca un film da aggiungere..." oninput="handleSearch('toWatch', this.value)">
                </div>
                <div id="dropdownToWatch" class="suggestions-dropdown"></div>
            </div>
            <div class="items-grid" id="gridToWatch"></div>
        </div>

        <!-- TAB: FILM VISTI -->
        <div id="watched" class="tab-content">
            <div class="search-wrapper">
                <div class="search-input-group">
                    <input type="text" id="inputWatched" placeholder="Cerca un film visto..." oninput="handleSearch('watched', this.value)">
                </div>
                <div id="dropdownWatched" class="suggestions-dropdown"></div>
            </div>
            <div class="items-grid" id="gridWatched"></div>
        </div>

        <!-- TAB: SERIE TV -->
        <div id="series" class="tab-content">
            <div class="search-wrapper">
                <div class="search-input-group">
                    <input type="text" id="inputSeries" placeholder="Cerca una serie TV da seguire..." oninput="handleSearch('series', this.value)">
                </div>
                <div id="dropdownSeries" class="suggestions-dropdown"></div>
            </div>
            <div class="items-grid" id="gridSeries"></div>
        </div>
    </div>

    <!-- SCRIPT FIREBASE E LOGICA APPLICATIVA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBnrRBXGSQdsjLWhTuybm0M_DtkF2KWzPs",
            authDomain: "tracker-1b9f7.firebaseapp.com",
            databaseURL: "https://tracker-1b9f7-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tracker-1b9f7",
            storageBucket: "tracker-1b9f7.firebasestorage.app",
            messagingSenderId: "883872596917",
            appId: "1:883872596917:web:63e86ea86c70c128bb4ffc",
            measurementId: "G-Z00R6T8EB2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const TMDB_API_KEY = '19a3e7d1a5356e8daa2323dabc5e1a2d';
        const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';

        let currentUser = null;
        let isRegistering = false;
        let data = { toWatch: [], watched: [], series: [] };

        // Gestione Auth UI Mode (Login / Registrazione)
        window.toggleAuthMode = function() {
            isRegistering = !isRegistering;
            document.getElementById('auth-title').innerText = isRegistering ? 'Registrati a CinePulse' : 'Accedi a CinePulse';
            document.getElementById('auth-submit-btn').innerText = isRegistering ? 'Crea Account' : 'Accedi';
            document.getElementById('auth-switch-text').innerText = isRegistering ? 'Hai già un account? Accedi' : 'Non hai un account? Registrati';
            document.getElementById('auth-error').innerText = '';
        }

        window.handleAuthSubmit = async function() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errorEl = document.getElementById('auth-error');
            errorEl.innerText = '';

            try {
                if (isRegistering) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                errorEl.innerText = error.message;
            }
        }

        window.logoutUser = function() {
            signOut(auth);
        }

        // Ascoltatore stato di autenticazione Firebase
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                document.getElementById('user-email-display').innerText = user.email;
                loadUserData(user.uid);
            } else {
                currentUser = null;
                document.getElementById('auth-screen').style.display = 'block';
                document.getElementById('app-screen').style.display = 'none';
            }
        });

        // Caricamento Dati in tempo reale dal Realtime Database
        function loadUserData(uid) {
            const userRef = ref(db, 'users/' + uid);
            onValue(userRef, (snapshot) => {
                const dbData = snapshot.val();
                if (dbData) {
                    data = dbData;
                } else {
                    // Dati vuoti iniziali
                    data = { toWatch: [], watched: [], series: [] };
                    set(userRef, data);
                }
                renderAll();
            });
        }

        // Salvataggio automatico su Firebase
        function saveDataToFirebase() {
            if (!currentUser) return;
            const userRef = ref(db, 'users/' + currentUser.uid);
            set(userRef, data);
        }

        // Navigazione Tab
        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // TMDB Ricerca Dinamica
        let searchTimeouts = {};
        window.handleSearch = function(section, query) {
            const dropdown = document.getElementById(`dropdown${capitalize(section)}`);
            clearTimeout(searchTimeouts[section]);

            if (!query || query.trim().length < 2) {
                dropdown.style.display = 'none';
                return;
            }

            searchTimeouts[section] = setTimeout(async () => {
                try {
                    let url = `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&language=it-IT&query=${encodeURIComponent(query)}`;
                    const response = await fetch(url);
                    const result = await response.json();

                    let items = result.results.filter(item => item.media_type === 'movie' || item.media_type === 'tv');
                    
                    if (section === 'series') {
                        items = items.sort((a, b) => (b.media_type === 'tv') - (a.media_type === 'tv'));
                    } else {
                        items = items.sort((a, b) => (b.media_type === 'movie') - (a.media_type === 'movie'));
                    }

                    showDropdown(section, items.slice(0, 6));
                } catch (error) {
                    console.error('Errore TMDB:', error);
                }
            }, 300);
        }

        function showDropdown(section, items) {
            const dropdown = document.getElementById(`dropdown${capitalize(section)}`);
            if (items.length === 0) {
                dropdown.style.display = 'none';
                return;
            }

            dropdown.innerHTML = items.map(item => {
                const title = item.title || item.name;
                const date = item.release_date || item.first_air_date || '';
                const year = date ? `(${date.split('-')[0]})` : '';
                const poster = item.poster_path ? `${IMAGE_BASE_URL}${item.poster_path}` : 'https://via.placeholder.com/45x65?text=No+Img';
                const typeLabel = item.media_type === 'tv' ? 'Serie TV' : 'Film';

                return `
                    <div class="suggestion-item" onclick='addItem("${section}", ${JSON.stringify({
                        id: item.id,
                        title: title,
                        poster: item.poster_path,
                        type: item.media_type
                    })})'>
                        <img src="${poster}" class="suggestion-poster" alt="${title}">
                        <div class="suggestion-info">
                            <h4>${escapeHtml(title)} ${year}</h4>
                            <p>${typeLabel}</p>
                        </div>
                    </div>
                `;
            }).join('');

            dropdown.style.display = 'block';
        }

        window.addItem = function(section, itemData) {
            document.getElementById(`input${capitalize(section)}`).value = '';
            document.getElementById(`dropdown${capitalize(section)}`).style.display = 'none';

            if (!data.series) data.series = [];
            if (!data.toWatch) data.toWatch = [];
            if (!data.watched) data.watched = [];

            if (section === 'series') {
                data.series.push({
                    id: Date.now(),
                    tmdbId: itemData.id,
                    title: itemData.title,
                    poster: itemData.poster,
                    season: 1,
                    episode: 1
                });
            } else if (section === 'toWatch') {
                data.toWatch.push({
                    id: Date.now(),
                    tmdbId: itemData.id,
                    title: itemData.title,
                    poster: itemData.poster
                });
            } else if (section === 'watched') {
                data.watched.push({
                    id: Date.now(),
                    tmdbId: itemData.id,
                    title: itemData.title,
                    poster: itemData.poster
                });
            }

            saveDataToFirebase();
        }

        window.moveToWatched = function(id) {
            const index = data.toWatch.findIndex(m => m.id === id);
            if (index !== -1) {
                const movie = data.toWatch.splice(index, 1)[0];
                data.watched.push(movie);
                saveDataToFirebase();
            }
        }

        window.deleteItem = function(section, id) {
            data[section] = data[section].filter(item => item.id !== id);
            saveDataToFirebase();
        }

        window.updateProgress = function(id, seasonChange, episodeChange) {
            const serie = data.series.find(s => s.id === id);
            if (serie) {
                serie.episode += episodeChange;
                if (serie.episode < 1) {
                    if (serie.season > 1) {
                        serie.season -= 1;
                        serie.episode = 1;
                    } else {
                        serie.episode = 1;
                    }
                }
                saveDataToFirebase();
            }
        }

        window.updateSeasonManual = function(id, change) {
            const serie = data.series.find(s => s.id === id);
            if (serie) {
                serie.season += change;
                if (serie.season < 1) serie.season = 1;
                saveDataToFirebase();
            }
        }

        function renderAll() {
            // Assicuriamoci che gli array esistano
            if(!data.toWatch) data.toWatch = [];
            if(!data.watched) data.watched = [];
            if(!data.series) data.series = [];

            // 1. To Watch
            const gridToWatch = document.getElementById('gridToWatch');
            gridToWatch.innerHTML = data.toWatch.length === 0 ? '<div class="empty-state">Nessun film in lista.</div>' : 
                data.toWatch.map(m => `
                    <div class="media-card">
                        <div class="media-poster-container">
                            <img src="${m.poster ? IMAGE_BASE_URL + m.poster : 'https://via.placeholder.com/300x180?text=No+Image'}" class="media-poster" alt="${m.title}">
                            <span class="media-type-badge">Film</span>
                        </div>
                        <div class="media-body">
                            <div class="media-title">${escapeHtml(m.title)}</div>
                            <div class="card-actions">
                                <button class="btn-action success" onclick="moveToWatched(${m.id})">Visto ✓</button>
                                <button class="btn-action danger" onclick="deleteItem('toWatch', ${m.id})">Elimina</button>
                            </div>
                        </div>
                    </div>
                `).join('');

            // 2. Watched
            const gridWatched = document.getElementById('gridWatched');
            gridWatched.innerHTML = data.watched.length === 0 ? '<div class="empty-state">Nessun film visto registrato.</div>' : 
                data.watched.map(m => `
                    <div class="media-card">
                        <div class="media-poster-container">
                            <img src="${m.poster ? IMAGE_BASE_URL + m.poster : 'https://via.placeholder.com/300x180?text=No+Image'}" class="media-poster" alt="${m.title}">
                            <span class="media-type-badge">Film Visto</span>
                        </div>
                        <div class="media-body">
                            <div class="media-title">${escapeHtml(m.title)}</div>
                            <div class="card-actions">
                                <button class="btn-action danger" onclick="deleteItem('watched', ${m.id})">Elimina</button>
                            </div>
                        </div>
                    </div>
                `).join('');

            // 3. Series
            const gridSeries = document.getElementById('gridSeries');
            gridSeries.innerHTML = data.series.length === 0 ? '<div class="empty-state">Nessuna serie TV in corso.</div>' : 
                data.series.map(s => `
                    <div class="media-card">
                        <div class="media-poster-container">
                            <img src="${s.poster ? IMAGE_BASE_URL + s.poster : 'https://via.placeholder.com/300x180?text=No+Image'}" class="media-poster" alt="${s.title}">
                            <span class="media-type-badge">Serie TV</span>
                        </div>
                        <div class="media-body">
                            <div class="media-title">${escapeHtml(s.title)}</div>
                            <div class="tracker-controls">
                                <div class="tracker-row">
                                    <span>Stagione: <b>${s.season}</b></span>
                                    <div class="counter-btns">
                                        <button class="btn-count" onclick="updateSeasonManual(${s.id}, -1)">-</button>
                                        <button class="btn-count" onclick="updateSeasonManual(${s.id}, 1)">+</button>
                                    </div>
                                </div>
                                <div class="tracker-row">
                                    <span>Episodio: <b>${s.episode}</b></span>
                                    <div class="counter-btns">
                                        <button class="btn-count" onclick="updateProgress(${s.id}, 0, -1)">-</button>
                                        <button class="btn-count" onclick="updateProgress(${s.id}, 0, 1)">+1</button>
                                    </div>
                                </div>
                            </div>
                            <div class="card-actions">
                                <button class="btn-action danger" onclick="deleteItem('series', ${s.id})">Elimina</button>
                            </div>
                        </div>
                    </div>
                `).join('');
        }

        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        window.addEventListener('click', function(e) {
            if (!e.target.closest('.search-wrapper')) {
                document.querySelectorAll('.suggestions-dropdown').forEach(d => d.style.display = 'none');
            }
        });
    </script>
</body>
</html>
